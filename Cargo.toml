[package]
name = "openlimiter"
description = "OpenLimiter: a modular mastering chain on OpenPluginSDK with GoodLookin DRI"
version = "1.0.0-beta"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
olm-api = { path = "crates/api" }
shaper = { path = "crates/shaper" }
limiter-modes = { path = "crates/limiter-modes" }
requantiser = { path = "crates/requantiser" }
tone-six = { path = "crates/tone-six" }
comp-sone = { path = "crates/comp-sone" }
limiter-clear = { path = "crates/limiter-clear" }
comp-dual = { path = "crates/comp-dual" }
limiter-wall = { path = "crates/limiter-wall" }
comp-bands = { path = "crates/comp-bands" }
eq-parametric = { path = "crates/eq-parametric" }
eq-dynamic = { path = "crates/eq-dynamic" }
reso-suppress = { path = "crates/reso-suppress" }
comp-harmonic = { path = "crates/comp-harmonic" }
dyn-decompress = { path = "crates/dyn-decompress" }
dyn-deexpand = { path = "crates/dyn-deexpand" }
harmonics = { path = "crates/harmonics" }
limiter-smart = { path = "crates/limiter-smart" }
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin" }

# Keep this project out of any parent workspace.
[workspace]
# The module crates build on their own, each with its own target folder.
exclude = ["crates"]
